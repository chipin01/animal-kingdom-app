<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="earInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fluffy Mane Base (8 soft overlapping rounded lobes) -->
  <g filter="url(#softShadow)">
    <circle cx="60" cy="31" r="17" fill="url(#maneGrad)" />
    <circle cx="82" cy="39" r="16" fill="url(#maneGrad)" />
    <circle cx="94" cy="59" r="16" fill="url(#maneGrad)" />
    <circle cx="88" cy="80" r="16" fill="url(#maneGrad)" />
    <circle cx="60" cy="91" r="17" fill="url(#maneGrad)" />
    <circle cx="32" cy="80" r="16" fill="url(#maneGrad)" />
    <circle cx="26" cy="59" r="16" fill="url(#maneGrad)" />
    <circle cx="38" cy="39" r="16" fill="url(#maneGrad)" />
    <!-- Center mane fill to smooth interior -->
    <circle cx="60" cy="62" r="36" fill="url(#maneGrad)" />
  </g>

  <!-- Left Ear -->
  <g>
    <circle cx="33" cy="40" r="13" fill="url(#faceGrad)" stroke="#d97706" stroke-width="1.8" />
    <circle cx="33" cy="40" r="7.5" fill="url(#earInnerGrad)" />
  </g>

  <!-- Right Ear -->
  <g>
    <circle cx="87" cy="40" r="13" fill="url(#faceGrad)" stroke="#d97706" stroke-width="1.8" />
    <circle cx="87" cy="40" r="7.5" fill="url(#earInnerGrad)" />
  </g>

  <!-- Cute Baby Lion Head -->
  <circle cx="60" cy="63" r="30" fill="url(#faceGrad)" stroke="#d97706" stroke-width="1.8" filter="url(#softShadow)" />

  <!-- Forehead Fur Tufts / Curls -->
  <path d="M54 36 C55 41, 57 43, 60 45 C63 43, 65 41, 66 36 C64 39, 61 40, 60 40 C59 40, 56 39, 54 36 Z" fill="#d97706" opacity="0.4" />
  <path d="M58 35 C59 39, 60 41, 62 42 C61 40, 60 38, 60 35 Z" fill="#b45309" opacity="0.5" />

  <!-- Tilted Cute Royal Crown -->
  <g transform="rotate(-12 60 32)" filter="url(#crownGlow)">
    <!-- Crown Base Arch -->
    <path d="M44 32 Q60 35 76 32 L78 20 L69 25 L60 14 L51 25 L42 20 Z" fill="url(#crownGrad)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Crown band -->
    <path d="M44 32 Q60 35 76 32 L75.5 35 Q60 38 44.5 35 Z" fill="#b45309" />
    <!-- Crown jewels -->
    <circle cx="42" cy="19" r="2.2" fill="#ef4444" stroke="#ffffff" stroke-width="0.7" />
    <circle cx="51" cy="24" r="1.8" fill="#10b981" stroke="#ffffff" stroke-width="0.6" />
    <circle cx="60" cy="13" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="69" cy="24" r="1.8" fill="#a855f7" stroke="#ffffff" stroke-width="0.6" />
    <circle cx="78" cy="19" r="2.2" fill="#ef4444" stroke="#ffffff" stroke-width="0.7" />
    <circle cx="60" cy="33.5" r="1.5" fill="#ffffff" />
  </g>

  <!-- Rosy Blush Cheeks -->
  <ellipse cx="40" cy="71" rx="6" ry="3.5" fill="#fb7185" opacity="0.5" />
  <ellipse cx="80" cy="71" rx="6" ry="3.5" fill="#fb7185" opacity="0.5" />

  <!-- Big Sparkling Cute Eyes -->
  <!-- Left Eye -->
  <g>
    <ellipse cx="46" cy="59" rx="6.5" ry="8" fill="url(#eyeGrad)" />
    <!-- Catchlights (twinkles) -->
    <circle cx="44" cy="56" r="2.8" fill="#ffffff" />
    <circle cx="48.5" cy="62" r="1.3" fill="#ffffff" />
    <!-- Cute eyelid shine / lash -->
    <path d="M39 56 Q46 51 53 56" fill="none" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" />
    <!-- Cute little anime eyebrow -->
    <path d="M41 49 Q46 46 51 48" fill="none" stroke="#92400e" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Right Eye -->
  <g>
    <ellipse cx="74" cy="59" rx="6.5" ry="8" fill="url(#eyeGrad)" />
    <!-- Catchlights (twinkles) -->
    <circle cx="72" cy="56" r="2.8" fill="#ffffff" />
    <circle cx="76.5" cy="62" r="1.3" fill="#ffffff" />
    <!-- Cute eyelid shine / lash -->
    <path d="M67 56 Q74 51 81 56" fill="none" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" />
    <!-- Cute little anime eyebrow -->
    <path d="M69 48 Q74 46 79 49" fill="none" stroke="#92400e" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Snout / Muzzle Area -->
  <ellipse cx="60" cy="73" rx="13" ry="8.5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" />

  <!-- Cute Heart/Button Nose -->
  <path d="M57 68.5 C57 67, 63 67, 63 68.5 C63 70.8, 60.5 72.8, 60 72.8 C59.5 72.8, 57 70.8, 57 68.5 Z" fill="#e11d48" />
  <!-- Nose highlight -->
  <ellipse cx="59" cy="68.2" rx="1.2" ry="0.6" fill="#ffffff" opacity="0.8" />

  <!-- Sweet Kitten Smile (:3) -->
  <path d="M54.5 73.5 Q57.5 76.5 60 73.5 Q62.5 76.5 65.5 73.5" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Tiny Happy Tongue Peeking -->
  <path d="M58 74.5 Q60 78.5 62 74.5 Z" fill="#fb7185" stroke="#e11d48" stroke-width="0.8" />

  <!-- Whisker Freckles -->
  <circle cx="51" cy="72" r="0.9" fill="#b45309" opacity="0.6" />
  <circle cx="49" cy="74" r="0.9" fill="#b45309" opacity="0.6" />
  <circle cx="69" cy="72" r="0.9" fill="#b45309" opacity="0.6" />
  <circle cx="71" cy="74" r="0.9" fill="#b45309" opacity="0.6" />
</svg>
