<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorer Lost in the Wild - THE ANIMAL KINGDOM</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #070a12 linear-gradient(rgba(8, 12, 22, 0.75), rgba(8, 12, 22, 0.85)), url('images/wildlife_background.jpg') center/cover no-repeat fixed;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(16, 185, 129, 0.35);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 520px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
    }
    .emoji { font-size: 5rem; margin-bottom: 16px; display: block; }
    h1 { font-size: 2.2rem; margin-bottom: 12px; color: #34d399; }
    p { font-size: 1.05rem; color: #94a3b8; margin-bottom: 28px; line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 12px 28px;
      border-radius: 50px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.6);
    }
  </style>
  <script>
    // Automatically redirect back to expedition base if opened accidentally
    setTimeout(() => {
      if (window.location.pathname.endsWith('404.html')) {
        window.location.replace('./');
      }
    }, 4000);
  </script>
</head>
<body>
  <div class="card">
    <span class="emoji">🧭</span>
    <h1>Off the Trail!</h1>
    <p>Looks like you wandered into uncharted territory. Redirecting you back to the wildlife expedition sanctuary...</p>
    <a href="./" class="btn">🌿 Return to Basecamp</a>
  </div>
</body>
</html>
